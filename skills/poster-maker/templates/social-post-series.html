<div tw="w-full h-full flex flex-col p-20" style="font-family:msyh,NotoSansCJK-Regular,NotoSansCJKsc-Regular,wqy-zenhei;background:linear-gradient(180deg,{{BG_TOP}} 0%,{{BG_MID}} 50%,{{BG_BOT}} 100%)">
  <div tw="flex items-center justify-between">
    <span tw="text-3xl font-bold text-white/90">{{BRAND}}</span>
    <span tw="px-6 py-2 rounded-full text-2xl font-semibold" style="background:{{ACCENT_SOFT}};color:{{ACCENT}}">{{CAPSULE}}</span>
  </div>
  <div tw="mt-16">
    <h1 tw="text-7xl font-bold text-white leading-tight">{{TITLE}}</h1>
    <p tw="text-3xl mt-6 font-semibold" style="color:{{ACCENT}}">{{HIGHLIGHT}}</p>
  </div>
  <div tw="flex-1 flex flex-col justify-center gap-6">
    <div tw="rounded-3xl bg-white/5 p-8">
      <span tw="text-3xl text-white/90 leading-relaxed">{{POINT_1}}</span>
    </div>
    <div tw="rounded-3xl bg-white/5 p-8">
      <span tw="text-3xl text-white/90 leading-relaxed">{{POINT_2}}</span>
    </div>
    <div tw="rounded-3xl bg-white/5 p-8">
      <span tw="text-3xl text-white/90 leading-relaxed">{{POINT_3}}</span>
    </div>
  </div>
  <div tw="flex items-center justify-between">
    <span tw="text-2xl text-white/50">{{FOOTER}}</span>
    <span tw="text-3xl font-bold text-white/80">{{PAGE}} / {{TOTAL}}</span>
  </div>
</div>
