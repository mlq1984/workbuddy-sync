<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Festival Poster Template</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; background:#8B0000; overflow:hidden; }
.bg { width:100%; height:100%; object-fit:cover; filter:brightness(0.85); }
.overlay { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:0 80px; color:#FFD700; }
.subtitle { font-family:'Noto Serif SC','ZCOOL KuaiLe',serif; font-size:32px; font-weight:400; margin-bottom:24px; letter-spacing:8px; opacity:0.9; }
.main-title { font-family:'Ma Shan Zheng','ZCOOL KuaiLe',cursive; font-size:120px; font-weight:400; line-height:1.2; text-shadow:0 4px 20px rgba(0,0,0,0.4); letter-spacing:12px; margin-bottom:32px; }
.slogan { font-family:'Noto Serif SC','ZCOOL KuaiLe',serif; font-size:28px; font-weight:300; margin-bottom:48px; opacity:0.9; letter-spacing:4px; }
.cta { background:#FFD700; color:#8B0000; padding:20px 80px; border-radius:50px; font-size:28px; font-weight:500; letter-spacing:6px; box-shadow:0 8px 30px rgba(255,215,0,0.3); }
.contact { margin-top:60px; font-size:20px; opacity:0.7; letter-spacing:2px; }
</style></head><body>
<img class="bg" src="{{BASE_IMAGE_URI}}" alt="festival">
<div class="overlay">
    <div class="subtitle">{{SUBTITLE}}</div>
    <h1 class="main-title">{{TITLE}}</h1>
    <div class="slogan">{{SLOGAN}}</div>
    <div class="cta">{{CTA_TEXT}}</div>
    <div class="contact">{{CONTACT_INFO}}</div>
</div>
</body></html>
