<style>
  :root {
    --text:#1f2329; --muted:#8a9099; --ph:#b9bec7; --err:#f53f3f;
    --fill:#f5f6f8; --accent:#151b2b; --accent2:#2b3550; --link:#3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;   /* 整页居中 */
    min-height: 100vh; padding: 24px;
    background: radial-gradient(1200px 700px at 50% -10%, #fdfaf5, #f6f1ea);
    background-size: cover; background-position: center; background-attachment: fixed;
  }
  .card {
    width: 100%; max-width: 440px;
    background: rgba(255,255,255,.96); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.7); border-radius: 18px;
    padding: 42px 44px 30px; box-shadow: 0 24px 70px rgba(20,24,40,.30);
  }

  /* ---------- 多视图动态切换 ---------- */
  .view { display: none; }
  .view.active { display: block; animation: fadeUp .3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  h1 { font-size: 40px; font-weight: 800; text-align: center; letter-spacing: 2px; margin-bottom: 28px; }

  /* ---------- 表单（对齐官网：灰底无边框圆角输入框） ---------- */
  .field { position: relative; margin-bottom: 26px; }   /* 间距刚好容纳悬浮红字，出错不挤动布局 */
  .field .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .field label { font-size: 14px; font-weight: 500; color: var(--text); }
  .field .aux { font-size: 13px; color: var(--muted); text-decoration: none; cursor: pointer; }
  .field .aux:hover { color: var(--text); }
  .input-box { position: relative; }
  .input-box input {
    width: 100%; padding: 13px 44px 13px 16px; font-size: 15px;
    border: 1px solid transparent; border-radius: 10px; outline: none;
    background: var(--fill); color: var(--text);
    transition: background .2s, border-color .2s, box-shadow .2s;
  }
  .input-box input:focus { background: #fff; border-color: #d5d9e0; box-shadow: 0 0 0 3px rgba(21,27,43,.06); }
  .input-box input::placeholder { color: var(--ph); }

  .eye, .send {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    border: 0; background: none; cursor: pointer; color: #9aa0aa; padding: 0;
  }
  .eye:hover, .send:hover:not(:disabled) { color: var(--text); }
  .eye svg, .send svg { width: 18px; height: 18px; }
  .eye .eye-off { display: none; }
  .eye.show .eye-on { display: none; }
  .eye.show .eye-off { display: block; }
  .send:disabled { color: #c3c8d0; cursor: not-allowed; }
  .send .cd { display: none; font-size: 13px; color: var(--muted); }
  .send.waiting svg { display: none; }
  .send.waiting .cd { display: block; }

  .hint { position: absolute; left: 0; top: calc(100% + 4px);      /* 悬浮于输入框正下方，不占布局 */
          font-size: 13px; color: var(--err); white-space: nowrap; }
  .hint:empty { display: none; }

  .primary {
    width: 100%; height: 48px; margin-top: 10px; font-size: 16px;
    color: #fff; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer;
    transition: background .2s, opacity .2s;
  }
  .primary:hover:not(:disabled) { background: var(--accent2); }
  .primary:disabled { opacity: .6; cursor: wait; }

  .links { text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted); }
  .links a { color: var(--link); font-weight: 600; text-decoration: none; cursor: pointer; margin-left: 4px; }
  .links a:hover { text-decoration: underline; }

  .ok-mask {
    display: none; position: fixed; inset: 0; background: rgba(255,255,255,.96);
    text-align: center; padding-top: 40vh; font-size: 18px; color: var(--text);
  }
</style>
</head>
<body>

<!-- 图标定义：同一图标在多处复用，避免重复堆叠同样的 SVG（<use> 为原生引用方式） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
  </symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
  </symbol>
  <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/>
  </symbol>
</svg>

<div class="card">

  <!-- ========== 登录视图 ========== -->
  <section class="view active" id="viewLogin">
    <h1>登录</h1>

    <div class="field">
      <label for="loginEmail">邮箱</label>
      <div class="input-box"><input id="loginEmail" type="email" autocomplete="email" placeholder="邮箱"></div>
      <div class="hint" id="loginEmailHint"></div>
    </div>

    <div class="field">
      <div class="row">
        <label for="loginPwd">密码</label>
        <a class="aux" id="toForgot">忘记密码</a>
      </div>
      <div class="input-box">
        <input id="loginPwd" type="password" autocomplete="current-password" placeholder="密码">
        <button class="eye" type="button" data-eye="loginPwd" aria-label="显示密码">
          <svg class="eye-on"><use href="#i-eye"/></svg>
          <svg class="eye-off"><use href="#i-eye-off"/></svg>
        </button>
      </div>
      <div class="hint" id="loginPwdHint"></div>
    </div>

    <button class="primary" id="loginBtn" type="button">登 录</button>
    <p class="links">还没有账号？<a id="toRegister">注册</a></p>
  </section>

  <!-- ========== 注册视图 ========== -->
  <section class="view" id="viewRegister">
    <h1>注册</h1>

    <div class="field">
      <label for="regEmail">邮箱</label>
      <div class="input-box"><input id="regEmail" type="email" autocomplete="email" placeholder="邮箱"></div>
      <div class="hint" id="regEmailHint"></div>
    </div>

    <div class="field">
      <label for="regCode">验证码</label>
      <div class="input-box">
        <input id="regCode" type="text" inputmode="numeric" placeholder="验证码">
        <button class="send" id="regSend" type="button" title="发送验证码">
          <svg><use href="#i-send"/></svg>
          <span class="cd"></span>
        </button>
      </div>
      <div class="hint" id="regCodeHint"></div>
    </div>

    <div class="field">
      <label for="regPwd">密码</label>
      <div class="input-box">
        <input id="regPwd" type="password" autocomplete="new-password" placeholder="密码">
        <button class="eye" type="button" data-eye="regPwd" aria-label="显示密码">
          <svg class="eye-on"><use href="#i-eye"/></svg>
          <svg class="eye-off"><use href="#i-eye-off"/></svg>
        </button>
      </div>
      <div class="hint" id="regPwdHint"></div>
    </div>

    <div class="field">
      <div class="input-box">
        <input id="regPwd2" type="password" autocomplete="new-password" placeholder="请再次输入密码">
        <button class="eye" type="button" data-eye="regPwd2" aria-label="显示密码">
          <svg class="eye-on"><use href="#i-eye"/></svg>
          <svg class="eye-off"><use href="#i-eye-off"/></svg>
        </button>
      </div>
      <div class="hint" id="regPwd2Hint"></div>
    </div>

    <button class="primary" id="regBtn" type="button">注 册</button>
    <p class="links">已有账号？<a data-go="login">登录</a></p>
  </section>

  <!-- ========== 忘记密码视图（对齐官网截图） ========== -->
  <section class="view" id="viewForgot">
    <h1>忘记密码</h1>

    <div class="field">
      <label for="fpEmail">邮箱</label>
      <div class="input-box"><input id="fpEmail" type="email" autocomplete="email" placeholder="邮箱"></div>
      <div class="hint" id="fpEmailHint"></div>
    </div>

    <div class="field">
      <label for="fpCode">验证码</label>
      <div class="input-box">
        <input id="fpCode" type="text" inputmode="numeric" placeholder="验证码">
        <button class="send" id="fpSend" type="button" title="发送验证码">
          <svg><use href="#i-send"/></svg>
          <span class="cd"></span>
        </button>
      </div>
      <div class="hint" id="fpCodeHint"></div>
    </div>

    <div class="field">
      <label for="fpPwd">密码</label>
      <div class="input-box">
        <input id="fpPwd" type="password" autocomplete="new-password" placeholder="密码">
        <button class="eye" type="button" data-eye="fpPwd" aria-label="显示密码">
          <svg class="eye-on"><use href="#i-eye"/></svg>
          <svg class="eye-off"><use href="#i-eye-off"/></svg>
        </button>
      </div>
      <div class="hint" id="fpPwdHint"></div>
    </div>

    <div class="field">
      <div class="input-box">
        <input id="fpPwd2" type="password" autocomplete="new-password" placeholder="请再次输入密码">
        <button class="eye" type="button" data-eye="fpPwd2" aria-label="显示密码">
          <svg class="eye-on"><use href="#i-eye"/></svg>
          <svg class="eye-off"><use href="#i-eye-off"/></svg>
        </button>
      </div>
      <div class="hint" id="fpPwd2Hint"></div>
    </div>

    <button class="primary" id="fpBtn" type="button">重置密码</button>
    <p class="links">返回登录？<a data-go="login">登录</a></p>
  </section>

</div>

<div class="ok-mask" id="okMask">登录成功，正在返回…</div>

<script>
const $ = id => document.getElementById(id);
const EMAIL_RE = /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)+$/;
const MSG_EMAIL_EMPTY = "请输入邮箱！";
const MSG_EMAIL = "请输入有效的邮箱！";
const MSG_PWD_EMPTY = "请输入密码！";
const MSG_PWD = "密码至少需要 8 位，并包含字母和数字";
const MSG_CODE = "请输入验证码！";
const MSG_CONFIRM = "请确认您的密码";
const MSG_MATCH = "两次输入的密码不一致";
const RESEND = 60;

/* ---------- 视图切换（动态 + 底部链接返回） ---------- */
const VIEWS = { login: "viewLogin", register: "viewRegister", forgot: "viewForgot" };
function go(name) {
  const id = VIEWS[name];
  if (!id) return;
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  $(id).classList.add("active");
  if (name === "register" && !$("regEmail").value) $("regEmail").value = $("loginEmail").value.trim();
  if (name === "forgot" && !$("fpEmail").value) $("fpEmail").value = $("loginEmail").value.trim();
  renderSendBtns();          // 邮箱可能刚被自动带入，发送按钮要按这个邮箱的冷却状态重算
}
document.querySelectorAll("[data-go]").forEach(el => el.addEventListener("click", () => go(el.dataset.go)));
$("toRegister").addEventListener("click", () => go("register"));
$("toForgot").addEventListener("click", () => go("forgot"));

/* ---------- 背景：Bing 每日壁纸（/api/bg 服务端代理），失败保留 CSS 渐变 ---------- */
(function loadBg() {
  fetch("/api/bg", { cache: "no-store" }).then(r => r.json()).then(d => {
    if (d && d.ok && d.url) {
      document.body.style.backgroundImage =
        'linear-gradient(rgba(246,241,234,.42),rgba(246,241,234,.42)), url("' + d.url + '")';
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center";
      document.body.style.backgroundAttachment = "fixed";
    }
  }).catch(() => {});
})();

/* ---------- 行内红字：输入即清除 ---------- */
document.querySelectorAll("input").forEach(inp => {
  const hint = $(inp.id + "Hint");
  if (hint) inp.addEventListener("input", () => hint.textContent = "");
});

/* ---------- 眼睛：明文/密文切换（两态图标） ---------- */
document.querySelectorAll("[data-eye]").forEach(btn => btn.addEventListener("click", () => {
  const p = $(btn.dataset.eye);
  const show = p.type === "password";
  p.type = show ? "text" : "password";
  btn.classList.toggle("show", show);
}));

/* ---------- 本地校验 ---------- */
const validEmail = v => EMAIL_RE.test(v);
const validPwd = v => v.length >= 8 && /[A-Za-z]/.test(v) && /\d/.test(v);
function check(emailId, pwdId, pwd2Id) {
  let ok = true;
  const email = $(emailId).value.trim();
  if (!email) { $(emailId + "Hint").textContent = MSG_EMAIL_EMPTY; ok = false; }
  else if (!validEmail(email)) { $(emailId + "Hint").textContent = MSG_EMAIL; ok = false; }
  if (pwdId) {
    const pwd = $(pwdId).value;
    if (!pwd) { $(pwdId + "Hint").textContent = MSG_PWD_EMPTY; ok = false; }
    else if (!validPwd(pwd)) { $(pwdId + "Hint").textContent = MSG_PWD; ok = false; }
    else if (pwd2Id) {
      const pwd2 = $(pwd2Id).value;
      if (!pwd2) { $(pwd2Id + "Hint").textContent = MSG_CONFIRM; ok = false; }
      else if (pwd2 !== pwd) { $(pwd2Id + "Hint").textContent = MSG_MATCH; ok = false; }
    }
  }
  return ok;
}

async function api(path, data) {
  let r;
  try {
    r = await fetch(path, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data || {})
    });
  } catch {
    // 本地服务已停（如进程退出/端口失效），给可操作提示而不是抛未捕获异常
    return { ok: false, message: "登录服务不可用，请稍后重试。" };
  }
  try { return await r.json(); } catch { return { ok: false, message: "服务异常，请重启登录服务" }; }
}

/* ---------- 验证码：纸飞机发送图标 + 60s 倒计时（每个邮箱独立计时，且刷新不丢） ---------- */
const SENDERS = [["regSend", "regEmail", "regCodeHint"],
                 ["fpSend", "fpEmail", "fpCodeHint"]];
const CD_KEY = "agnes_code_cd";            // {邮箱: 到期时间戳ms}；存 localStorage，刷新不丢
let cdExp = loadCd();
function loadCd() {
  try {
    const o = JSON.parse(localStorage.getItem(CD_KEY) || "{}"), now = Date.now();
    for (const e of Object.keys(o)) if ((o[e] || 0) <= now) delete o[e];   // 清掉已过期
    return o;
  } catch { return {}; }
}
function saveCd() {
  try { localStorage.setItem(CD_KEY, JSON.stringify(cdExp)); } catch { /* 隐私模式忽略 */ }
}
function cdLeft(email) {                    // 剩余秒数，由到期时间戳实时算出
  const ms = (cdExp[email] || 0) - Date.now();
  return ms > 0 ? Math.ceil(ms / 1000) : 0;
}
function renderSendBtns() {
  SENDERS.forEach(([btnId, emailId]) => {
    // 按钮状态只取决于「自己那个输入框」里的邮箱，切界面/换账号不会串台
    const left = cdLeft(($(emailId).value || "").trim());
    const b = $(btnId);
    b.disabled = left > 0;
    b.classList.toggle("waiting", left > 0);
    b.querySelector(".cd").textContent = left > 0 ? `${left}s` : "";
  });
}
let cdTimer = null;
function tick() {
  let live = false;
  for (const e of Object.keys(cdExp)) {
    if (cdLeft(e) > 0) live = true; else delete cdExp[e];
  }
  saveCd(); renderSendBtns();
  cdTimer = live ? setTimeout(tick, 1000) : null;
}
async function requestCode(email, hintId) {
  if (cdLeft(email) > 0) return;            // 该邮箱仍在冷却
  const r = await api("/api/code", { email });
  // 无论成功还是被平台限流，都进入冷却：避免继续猛点把风控窗口越拖越长
  cdExp[email] = Date.now() + RESEND * 1000;
  saveCd();
  if (!r.ok) $(hintId).textContent = r.message || "发送失败，请重试";
  renderSendBtns();
  if (!cdTimer) tick();
}
renderSendBtns();                           // 进页面即按持久化状态渲染，刷新后按钮仍是倒计时中
SENDERS.forEach(([btnId, emailId, hintId]) => {
  $(btnId).addEventListener("click", () => {
    const v = $(emailId).value.trim();
    if (!v) { $(emailId + "Hint").textContent = MSG_EMAIL_EMPTY; return; }
    if (!validEmail(v)) { $(emailId + "Hint").textContent = MSG_EMAIL; return; }
    requestCode(v, hintId);
  });
  // 邮箱一改就按新邮箱重算按钮：换账号后倒计时立即失效，不会沿用上一个账号的等待
  $(emailId).addEventListener("input", renderSendBtns);
});

/* ---------- 登录 ---------- */
$("loginBtn").addEventListener("click", async () => {
  const email = $("loginEmail").value.trim(), password = $("loginPwd").value;
  if (!check("loginEmail", "loginPwd")) return;
  const btn = $("loginBtn");
  btn.disabled = true; btn.textContent = "登录中…";
  try {
    const r = await api("/api/login", { email, password });
    if (r.ok) return success();
    $("loginPwdHint").textContent = r.message || "邮箱或密码错误";
  } finally { btn.disabled = false; btn.textContent = "登 录"; }
});

/* ---------- 注册 / 忘记密码：同一条链路 ----------
   两者都走 reset_password（新邮箱=建号、老邮箱=改密），成功后自动登录；
   只有「面向用户的文案」不同，故收敛为一个函数，避免同样逻辑抄两遍。     */
async function submitReset(o) {
  const email = $(o.email).value.trim(), password = $(o.pwd).value, code = $(o.code).value.trim();
  if (!check(o.email, o.pwd, o.pwd2)) return;
  if (!code) { $(o.codeHint).textContent = MSG_CODE; return; }
  const btn = $(o.btn);
  btn.disabled = true; btn.textContent = o.doing;
  try {
    const r = await api("/api/reset", { email, password, code });
    if (!r.ok) { $(o.codeHint).textContent = r.message || o.failMsg; return; }
    const lr = await api("/api/login", { email, password });
    if (lr.ok) return success();
    go("login");                       // 建号/改密成功但自动登录失败 -> 回登录页让用户自己登
    $("loginEmail").value = email;
    $("loginPwdHint").textContent = o.okMsg;
  } finally { btn.disabled = false; btn.textContent = o.idle; }
}
$("regBtn").addEventListener("click", () => submitReset({
  email: "regEmail", pwd: "regPwd", pwd2: "regPwd2", code: "regCode", btn: "regBtn",
  codeHint: "regCodeHint", doing: "注册中…", idle: "注 册",
  failMsg: "注册失败，请重试", okMsg: "注册成功，请登录"
}));
$("fpBtn").addEventListener("click", () => submitReset({
  email: "fpEmail", pwd: "fpPwd", pwd2: "fpPwd2", code: "fpCode", btn: "fpBtn",
  codeHint: "fpCodeHint", doing: "重置中…", idle: "重置密码",
  failMsg: "重置失败，请重试", okMsg: "密码重置成功，请使用新密码登录。"
}));

/* ---------- 回车提交 ---------- */
[["loginEmail", "loginBtn"], ["loginPwd", "loginBtn"],
 ["regEmail", "regBtn"], ["regPwd", "regBtn"], ["regPwd2", "regBtn"], ["regCode", "regBtn"],
 ["fpEmail", "fpBtn"], ["fpCode", "fpBtn"], ["fpPwd", "fpBtn"], ["fpPwd2", "fpBtn"]].forEach(([inp, btn]) => {
  $(inp).addEventListener("keydown", e => { if (e.key === "Enter") $(btn).click(); });
});

function success() {
  $("okMask").style.display = "block";
  setTimeout(() => { window.close(); }, 800);  // 关不掉也无妨，agent 已拿到 Key
}
</script>
</body>
</html>
