; Ai公益生图Pro · 技能配置
; 通道为自包含单元（channels/<id>/），无需在此指向外部目录；
; 新增通道 = 在 channels/ 下建文件夹并实现 app.py（详见 channels/*/api.md）。

[common]
; 统一凭证文件：~/.aipro/credentials.json（按通道分段，由 core.store 管理与读写）。
; 各通道 Key 不在此处，统一由编排器的统一凭证仓库管理。

[result]
; 产物落盘根目录（图片平铺直存，命名 通道_YYYYMMDD_HHMMSS_毫秒.ext，并登记 img.json）。
; 解析优先级：工作台设置（运行时关联 ~/.aipro/storage.json，改完立即生效）>
; 此处 dir 显式指定（改后重启中心服务生效）> 桌面自动探测（兼容 OneDrive 重定向）
; > 回退 ~/.aipro/output。指定绝对路径（支持 ~ 展开），例如：
; dir = D:\图库\Ai公益生图Pro

[server]
; 8765 被用户的股票分析报告静态服务（python -m http.server）长期占用，
; 中心改用 8766；启动后会写入 ~/.aipro/center.json，调用时以该文件为准。
port = 8766
