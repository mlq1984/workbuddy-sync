<!DOCTYPE html>
<!-- 混合海报压字模板：替换 __BG_IMAGE__ 为底图 file:/// 绝对路径，改文案后渲染
     渲染: node ~/.workbuddy/skills/poster-maker/scripts/render.mjs --html this.html -o out.png --width 1080 --height 1920 -->
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  .stage { position:relative; width:1080px; height:1920px; overflow:hidden;
    font-family:"Microsoft YaHei", "SimHei", sans-serif; }
  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  /* 顶部压深保证标题可读；深色底图加深、浅底图调淡透明度 */
  .shade { position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(90,8,8,.55) 0%, rgba(90,8,8,0) 26%,
                rgba(0,0,0,0) 68%, rgba(60,4,4,.62) 100%); }
  .title { position:absolute; top:118px; width:100%; text-align:center;
    font-size:150px; font-weight:900; letter-spacing:22px; text-indent:22px;
    color:#ffe9a8;
    text-shadow:0 6px 28px rgba(120,10,10,.85), 0 0 3px rgba(255,215,0,.9); }
  .sub { position:absolute; top:310px; width:100%; text-align:center;
    font-size:44px; letter-spacing:16px; text-indent:16px; color:#ffd76e;
    text-shadow:0 3px 14px rgba(120,10,10,.8); }
  .rule { position:absolute; top:392px; left:50%; transform:translateX(-50%);
    width:520px; height:2px;
    background:linear-gradient(90deg, transparent, #ffd76e, transparent); }
  .year { position:absolute; bottom:96px; width:100%; text-align:center;
    font-size:36px; letter-spacing:10px; color:#ffe9a8; opacity:.95;
    text-shadow:0 2px 10px rgba(0,0,0,.7); }
  .stamp { position:absolute; top:150px; right:88px; width:96px; height:96px;
    border:3px solid rgba(255,233,168,.85); border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:38px; color:#ffe9a8; transform:rotate(8deg);
    background:rgba(140,16,16,.35); }
</style></head>
<body>
<div class="stage">
  <img class="bg" src="__BG_IMAGE__">
  <div class="shade"></div>
  <div class="title">庆祝国庆</div>
  <div class="rule"></div>
  <div class="sub">盛世华诞 · 举国同庆</div>
  <div class="stamp">77</div>
  <div class="year">1949 — 2026</div>
</div>
</body></html>
